
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal AI</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0e17;
  color: #e8eaf2;
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 250px;
  background: #111522;
  border-right: 1px solid #252b3b;
  padding: 22px 15px;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 1px;
  margin: 5px 8px 35px;
  color: #a5b4fc;
}

.new-chat {
  padding: 13px;
  border: 1px solid #414c75;
  background: #202943;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
}

.menu-title {
  color: #78839b;
  font-size: 11px;
  margin: 30px 10px 12px;
  letter-spacing: 1px;
}

.menu-item {
  padding: 13px 12px;
  margin-bottom: 5px;
  border-radius: 8px;
  color: #aeb7ca;
  cursor: pointer;
  font-size: 14px;
}

.menu-item:hover,
.menu-item.active {
  background: #222b43;
  color: #a5b4fc;
}

.sidebar-bottom {
  margin-top: auto;
}

.profile {
  border-top: 1px solid #252b3b;
  padding: 17px 5px 5px;
  color: #aeb7ca;
  font-size: 13px;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header {
  height: 70px;
  border-bottom: 1px solid #252b3b;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
}

.header-title {
  font-weight: bold;
  font-size: 16px;
}

.status {
  font-size: 12px;
  color: #69dca5;
}

.status::before {
  content: "● ";
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 35px 20px;
}

.welcome {
  text-align: center;
  margin: 10vh auto 40px;
  max-width: 550px;
}

.ai-icon {
  width: 65px;
  height: 65px;
  margin: auto auto 25px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  font-size: 30px;
  background: linear-gradient(135deg,#273b70,#6946a8);
  box-shadow: 0 0 35px #5265bc33;
}

.welcome h1 {
  font-size: 30px;
  margin-bottom: 12px;
}

.welcome p {
  color: #8994aa;
  line-height: 1.8;
  font-size: 14px;
}

.messages {
  max-width: 760px;
  margin: auto;
}

.message {
  padding: 15px 18px;
  margin: 15px 0;
  border-radius: 14px;
  line-height: 1.7;
  font-size: 14px;
  white-space: pre-wrap;
}

.user {
  background: #26375e;
  margin-left: auto;
  max-width: 80%;
  width: fit-content;
}

.ai {
  background: #171e2e;
  border: 1px solid #28324a;
  max-width: 85%;
}

.input-area {
  padding: 15px 20px 25px;
}

.input-box {
  max-width: 760px;
  margin: auto;
  display: flex;
  align-items: center;
  background: #171e2e;
  border: 1px solid #343f59;
  border-radius: 15px;
  padding: 8px 10px 8px 17px;
}

.input-box:focus-within {
  border-color: #7186df;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 14px;
  padding: 12px 0;
}

input::placeholder {
  color: #68758c;
}

.send {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 10px;
  background: #6378d9;
  color: white;
  font-size: 19px;
  cursor: pointer;
}

.send:hover { background: #8193ed; }

.note {
  text-align: center;
  color: #647087;
  font-size: 10px;
  margin-top: 12px;
}

@media(max-width:650px) {
  .sidebar {
    width: 65px;
    padding: 15px 7px;
  }
  .logo {
    font-size: 0;
    text-align: center;
    margin: 8px 0 25px;
  }
  .logo::after {
    content: "AI";
    font-size: 18px;
  }
  .new-chat {
    font-size: 0;
    text-align: center;
    padding: 12px 3px;
  }
  .new-chat::after {
    content: "+";
    font-size: 20px;
  }
  .menu-title, .menu-text, .profile {
    display: none;
  }
  .menu-item {
    text-align: center;
    padding: 14px 2px;
    font-size: 17px;
  }
  .header { padding: 0 15px; }
  .welcome h1 { font-size: 24px; }
  .input-area { padding: 12px 10px 18px; }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo">PERSONAL AI</div>

    <button class="new-chat" onclick="newChat()">
      ＋　新しい会話
    </button>

    <div class="menu-title">MAIN MENU</div>

    <div class="menu-item active" onclick="showPage('chat',this)">💬 <span class="menu-text">チャット</span></div>
    <div class="menu-item" onclick="showPage('characters',this)">👤 <span class="menu-text">キャラクター</span></div>
    <div class="menu-item" onclick="showPage('memory',this)">🧠 <span class="menu-text">メモリー</span></div>
    <div class="menu-item" onclick="showPage('voice',this)">🎙️ <span class="menu-text">音声会話</span></div>
    <div class="menu-item" onclick="showPage('agent',this)">⚙️ <span class="menu-text">AIエージェント</span></div>

    <div class="sidebar-bottom">
      <div class="menu-item" onclick="showPage('settings',this)">⚙️ <span class="menu-text">設定</span></div>
      <div class="profile">● Personal AI<br><br>開発バージョン 0.1</div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-title" id="pageTitle">新しい会話</div>
      <div class="status">SYSTEM ONLINE</div>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="ai-icon">✦</div>
        <h1>Welcome to Personal AI</h1>
        <p>
          あなた専用のAIアシスタント。<br>
          ここから新しい会話を始めましょう。
        </p>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <div class="input-area">
      <div class="input-box">
        <input
          id="messageInput"
          type="text"
          placeholder="メッセージを入力..."
          onkeydown="if(event.key==='Enter') sendMessage()"
        >
        <button class="send" onclick="sendMessage()">↑</button>
      </div>
      <div class="note">
        Personal AI v0.1 ｜ AI接続はこれから実装します
      </div>
    </div>
  </main>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text) return;

  document.getElementById("welcome").style.display = "none";

  const messages = document.getElementById("messages");

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;
  messages.appendChild(userMessage);

  const reply = document.createElement("div");
  reply.className = "message ai";
  reply.textContent =
    "メッセージを受け取りました！\n現在は画面の試作段階です。次の開発でAIを接続します。";
  messages.appendChild(reply);

  input.value = "";
  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;
}

function newChat() {
  document.getElementById("messages").innerHTML = "";
  document.getElementById("welcome").style.display = "block";
  document.getElementById("pageTitle").textContent = "新しい会話";
}

function showPage(page, element) {
  document.querySelectorAll(".menu-item").forEach(item => {
    item.classList.remove("active");
  });
  element.classList.add("active");

  const titles = {
    chat: "新しい会話",
    characters: "キャラクター",
    memory: "メモリー",
    voice: "音声会話",
    agent: "AIエージェント",
    settings: "設定"
  };

  document.getElementById("pageTitle").textContent = titles[page];

  if (page === "chat") {
    return;
  }

  document.getElementById("welcome").style.display = "none";
  document.getElementById("messages").innerHTML =
    '<div class="message ai">' +
    titles[page] +
    ' の画面は今後の開発で実装します。</div>';
}
</script>
</body>
</html>
